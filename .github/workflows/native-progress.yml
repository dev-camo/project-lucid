name: Refresh native progress

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/code-progress.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: native-progress-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      compile: ${{ steps.gate.outputs.run }}
      head: ${{ steps.gate.outputs.head }}
      request_base64: ${{ steps.gate.outputs.request_base64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/main_progress.py gate

  compile:
    name: Merged main compilation and progress
    needs: gate
    if: needs.gate.outputs.compile == 'true'
    runs-on: [self-hosted, Linux, X64, lucid-native]
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      REQUEST_BASE64: ${{ needs.gate.outputs.request_base64 }}
      LUCID_UNITY_EDITOR: /opt/unity/Editor/Unity
      DOTNET_ROOT: /opt/dotnet
      LD_LIBRARY_PATH: /opt/lucid/compat-jammy/usr/lib/x86_64-linux-gnu
    outputs:
      producer_base64: ${{ steps.seal.outputs.producer_base64 }}
      report_base64: ${{ steps.seal.outputs.report_base64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Use installed native toolchains
        run: echo '/opt/dotnet' >> "$GITHUB_PATH"
      - id: compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controller/.github/scripts/main_progress.py compile
      - id: seal
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_OUTPUTS: ${{ toJSON(steps.compile.outputs) }}
        run: python3 controller/.github/scripts/main_progress.py seal
      - name: Dispose this run's compilation checkouts
        if: always()
        timeout-minutes: 3
        run: python3 controller/.github/scripts/main_progress.py cleanup

  publish:
    needs: [gate, compile]
    if: >-
      always() && !cancelled() && needs.gate.result == 'success' &&
      needs.compile.result == 'success' && github.repository == 'dev-camo/project-lucid' &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: lucid-progress-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.gate.outputs.head }}
          path: source
          persist-credentials: false
      - name: Validate sealed main evidence before minting a write token
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_BASE64: ${{ needs.gate.outputs.request_base64 }}
          PRODUCER_BASE64: ${{ needs.compile.outputs.producer_base64 }}
          REPORT_BASE64: ${{ needs.compile.outputs.report_base64 }}
        run: python3 control/.github/scripts/main_progress.py validate
      - name: Mint repository-scoped publisher token
        id: publisher
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.LUCID_PROGRESS_APP_CLIENT_ID }}
          private-key: ${{ secrets.LUCID_PROGRESS_APP_PRIVATE_KEY }}
          owner: dev-camo
          repositories: project-lucid
          permission-contents: write
      - name: Fast-forward only verified generated main data
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          REQUEST_BASE64: ${{ needs.gate.outputs.request_base64 }}
          PRODUCER_BASE64: ${{ needs.compile.outputs.producer_base64 }}
          REPORT_BASE64: ${{ needs.compile.outputs.report_base64 }}
        run: python3 control/.github/scripts/main_progress.py publish
