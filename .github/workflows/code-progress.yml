name: Code progress

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_head:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the requested commit for explicit checks
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: test -z "$EXPECTED_HEAD" || test "$GITHUB_SHA" = "$EXPECTED_HEAD"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.9'
      - run: python3 -m unittest discover -s tools/tests
      - run: python3 tools/lucid.py progress --check
