name: PR compilation
run-name: >-
  PR compilation (upstream ${{ github.event.workflow_run.id }}/${{ github.event.workflow_run.run_attempt }} ${{ github.event.workflow_run.event }} ${{ github.event.workflow_run.head_sha }})

on:
  workflow_run:
    workflows: [Code progress]
    types: [completed]

permissions: {}

concurrency:
  group: native-progress-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      compile: ${{ steps.gate.outputs.run }}
      request_base64: ${{ steps.gate.outputs.request_base64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/main_progress.py pr-gate

  start:
    name: Report pending compilation
    needs: gate
    if: needs.gate.outputs.compile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      REQUEST_BASE64: ${{ needs.gate.outputs.request_base64 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/main_progress.py pr-status-pending

  compile:
    name: Native compilation and evidence
    needs: [gate, start]
    if: needs.gate.outputs.compile == 'true'
    runs-on: [self-hosted, Linux, X64, lucid-native]
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      REQUEST_BASE64: ${{ needs.gate.outputs.request_base64 }}
      LUCID_UNITY_EDITOR: /opt/unity/Editor/Unity
      DOTNET_ROOT: /opt/dotnet
      LD_LIBRARY_PATH: /opt/lucid/compat-jammy/usr/lib/x86_64-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - name: Use installed native toolchains
        run: echo '/opt/dotnet' >> "$GITHUB_PATH"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 controller/.github/scripts/main_progress.py pr-compile
      - name: Dispose this run's compilation checkouts
        if: always()
        timeout-minutes: 3
        run: python3 controller/.github/scripts/main_progress.py cleanup

  report:
    name: Report PR compilation result
    needs: [gate, compile]
    if: always() && needs.gate.outputs.compile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      REQUEST_BASE64: ${{ needs.gate.outputs.request_base64 }}
      COMPILE_RESULT: ${{ needs.compile.result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 control/.github/scripts/main_progress.py pr-status-final
